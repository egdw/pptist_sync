<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShowFlow · HTML 副屏</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061832;color:#dff6ff;font-family:system-ui,'Microsoft YaHei',sans-serif}#stage{position:absolute;inset:0}#stage iframe{width:100%;height:100%;border:0;display:block}#status{position:fixed;inset:0;display:grid;place-content:center;gap:14px;text-align:center;padding:40px;z-index:10;background:#061832}#status[hidden]{display:none}#status strong{font-size:24px}#status p{max-width:700px;white-space:pre-wrap;line-height:1.6}#status button{justify-self:center}button,select{font:inherit;padding:8px 12px;border:1px solid #419acc;border-radius:5px;background:#133e67;color:white;cursor:pointer}#tools{position:fixed;top:0;right:0;left:0;display:flex;align-items:center;gap:8px;background:rgba(2,15,35,.95);padding:10px 16px;z-index:20;transform:translateY(calc(-100% + 7px));transition:transform .15s}#tools:hover,#tools:focus-within,body.preview #tools{transform:none}#tools .spacer{flex:1}#page-picker{max-width:45vw}body.preview #stage{top:58px}#update{display:none;border-color:#ffd16b;color:#ffe2a2}#connection{font-size:12px;color:#91b9d2;white-space:nowrap}#retry{display:none}#status.failed #retry{display:block}
</style></head><body>
<div id="stage"></div><div id="status"><strong id="status-title">正在加载流程网页</strong><p id="status-text">请稍候</p><button id="retry">重新加载</button></div>
<nav id="tools" aria-label="副屏工具"><button id="prev">上一页</button><select id="page-picker" aria-label="选择流程画面"></select><button id="next">下一页</button><span class="spacer"></span><span id="connection"></span><button id="update">已发布新版 · 点击载入</button><button id="full">全屏</button></nav>
<script src="/api/studio/html-runtime.js"></script></body></html>
