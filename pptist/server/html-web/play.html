<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPTist · HTML 工作流程</title><link rel="stylesheet" href="/html-support/style.css"></head><body class="player-page">
<div id="stage"></div><div id="empty" class="player-empty"><h1 id="empty-title">正在读取 HTML 工作流程</h1><p id="empty-description">加载完成后直接显示完整网页。</p><a href="/upload">前往上传管理</a></div>
<div class="toolbar-trigger" id="toolbar-trigger"></div><nav class="player-toolbar" id="toolbar" aria-label="HTML 播放控制"><button id="previous">← 上一页</button><span id="page-label">— / —</span><button id="next">下一页 →</button><button id="directory">目录</button><button id="overview">总览</button><i class="divider"></i><button id="fullscreen">全屏</button><button id="audience">观众窗口</button><button id="settings">HTML 联动</button><a href="/upload" target="_blank" rel="noopener">上传管理 ↗</a><button id="hide-toolbar" aria-label="收起工具栏">收起</button></nav>
<div id="toast" class="toast" role="status" hidden></div><div id="preview-badge" class="preview-badge" hidden>预览模式 · 未替换大屏 · 不发送联动消息</div>
<dialog id="link-dialog" class="link-dialog"><div class="dialog-heading"><h2>HTML 放映联动</h2><button id="close-settings">关闭</button></div><p class="hint">沿用原四字段协议 event / page / id / notes。当前页标题作为 HTML 备注；设置仅保存在本机浏览器，不改原 PPT 联动设置。</p><form id="link-form" class="link-form">
<fieldset><legend>WebSocket</legend><label><input type="checkbox" name="wsEnabled"> 启用 WebSocket</label><label>地址<input name="wsUrl" placeholder="ws://服务器IP:端口"></label><label>Token（可选）<input name="wsToken" type="password" autocomplete="off"></label></fieldset>
<fieldset><legend>MQTT over WebSocket</legend><label><input type="checkbox" name="mqttEnabled"> 启用 MQTT</label><label>地址<input name="mqttUrl" placeholder="ws://服务器IP:8083/mqtt"></label><div class="form-grid"><label>用户名<input name="mqttUsername" autocomplete="off"></label><label>密码<input name="mqttPassword" type="password" autocomplete="off"></label></div><label>发布主题<input name="mqttTopic" placeholder="presentation/events"></label><div class="form-grid"><label>QoS<select name="mqttQos"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></label><label>Client ID（空为自动生成）<input name="mqttClientId"></label></div><label><input type="checkbox" name="mqttRetain"> Retain</label></fieldset>
<label><input type="checkbox" name="remember"> 记住凭据（将以明文保存在本机浏览器）</label><button class="primary" type="submit">保存并连接</button><button type="button" id="import-original" class="secondary">读取原 PPT 已保存的配置</button>
<p id="link-status" class="link-status"></p><pre id="link-log" class="logs">等待工作页面加载。</pre></form></dialog>
<script type="module" src="/html-support/play.js"></script></body></html>
